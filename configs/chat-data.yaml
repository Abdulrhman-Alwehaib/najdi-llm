engine:
  model: cyankiwi/Qwen3.8-27B-AWQ-INT4
  max_model_len: 8192
  gpu_memory_utilization: 0.85
  max_num_batched_tokens: 4096
  max_num_seqs: 64
  kv_cache_dtype: auto
thinking: low
judge_thinking: low
thinking_extra_tokens: 2000
sampling: {temperature: 0.8, top_p: 0.9, top_k: 20, presence_penalty: 0.0, max_tokens: 2500}
judge_sampling: {temperature: 0.3, top_p: 0.95, top_k: 20, max_tokens: 600}
pilot: true
pilot_rows: 50
targets: {helpful: 1500, identity: 200}
parts:
  A: [helpful]
  B: [identity]
batch_tasks: 120
push_every: 300
telegram_every: 100
seed: 1234
max_attempts_factor: 15
assistant_name: ''
creator_name: ''
repo_id: ""
voho_id: VohoAI/voho-saudi-dialogues
places_per_prompt: 8
place_summary_words: 40
output_dir: runs/chat-data
filters:
  user_words: [1, 90]
  assist_words:
    helpful: [5, 95]
    identity: [2, 70]
  min_saudi_per_100w: 5.0
  min_saudi_per_reply: 1
  najdi_min_words: 6
  max_fusha_ratio: 0.2
  max_english_run: 3
  dialect_classifier: IbrahimAmin/marbertv2-arabic-written-dialect-classifier
  classifier_min_words: 5
  dedup_jaccard: 0.6
  opener_max_frac: 0.02
