  max_model_len: 8192
  gpu_memory_utilization: 0.85
  max_num_batched_tokens: 4096
  max_num_seqs: 64
  kv_cache_dtype: auto
thinking: low
thinking_extra_tokens: 2000
sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, presence_penalty: 0.0, max_tokens: 3000}
verify_sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 6000}
pilot: true
pilot_rows: 100
target_rows: 4000
science_frac: 0.6
batch_tasks: 160
push_every: 500
telegram_every: 100
seed: 1234
id_prefix: sci
repo_id: ""
voho_id: VohoAI/voho-saudi-dialogues
output_dir: runs/science
wiki:
  dataset: wikimedia/wikipedia
  subset: 20231101.ar
  passage_words: [120, 380]
  min_keyword_hits: 3
  label_chunk: 1500
  max_candidates: null
filters:
  assist_words: [30, 230]
  user_words: [2, 80]
  min_saudi_per_100w: 8.0
  min_saudi_per_reply: 1
  max_fusha_ratio: 0.2
  max_english_run: 4
  dialect_classifier: IbrahimAmin/marbertv2-arabic-written-dialect-classifier
  dedup_jaccard: 0.6
  check_answer_in_reply: true
